# Both services deploy from the current test branch using free hosting only.
services:
  - type: web
    name: metalerosion-api
    branch: Test-Deploy
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Bound CPU-library thread pools and allocator/cache retention on Free.
      # This does not guarantee that inference fits within 512 MiB.
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: ONEDNN_PRIMITIVE_CACHE_CAPACITY
        value: "0"
      # User-approved low-memory mode; validate accuracy separately from 1024px.
      - key: INFERENCE_BACKEND
        value: onnx
      - key: MODEL_IMAGE_SIZE
        value: "512"
      - key: INFERENCE_MAX_SIDE
        value: "512"
      - key: MAX_IMAGE_PIXELS
        value: "4194304"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: metal-scans
      - key: SUPABASE_STORAGE_PRIVATE
        value: "true"
      - key: SUPABASE_SIGNED_URL_TTL
        value: "3600"
      - key: MODEL_PATH
        value: models/best.pt
      - key: METAL_CLASSIFIER_PATH
        value: models/metal_cls.pt
      - key: RUST_MEASUREMENT
        value: hybrid
      - key: METAL_CLASSIFIER_THRESHOLD
        value: "0.4"
      - key: MODEL_CONFIDENCE
        value: "0.15"
      - key: VALIDATION_CONFIDENCE
        value: "0.5"
      - key: MIN_SURFACE_AREA_RATIO
        value: "0.05"

  - type: web
    name: metalerosion-frontend
    branch: Test-Deploy
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24.13.0"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        fromService:
          name: metalerosion-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
